# Weekly dependency update pull requests. Commit messages are Conventional Commits ("chore(deps): ...",
# "chore(deps-dev): ..."), so they cause no release; commitlint skips Dependabot's long commit bodies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # The Expo SDK pins these to versions that work together, so they move as one group, patch releases only.
      # A minor or major bump is an SDK upgrade: do it by hand with `npx expo upgrade` / `npx expo install`.
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-native-async-storage/*"
          - "@react-native-community/*"
          - "@types/react"
      # Everything else (zod, TypeScript, vitest, Prettier, commitlint, husky): one weekly PR for minor and patch.
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-native-async-storage/*"
          - "@react-native-community/*"
          - "@types/react"
        update-types:
          - minor
          - patch
    ignore:
      # SDK-pinned packages: patch only (see the expo-sdk group).
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-async-storage/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
